name: release
# A tag vX.Y.Z (or vX.Y.Z-rc.N) on main builds every binary, signs
# SHA256SUMS with the release key, and publishes a GitHub release. Binaries
# update only to a release this key signed.
#
# Once: go run ./pkg/release/keygen, then in the repository settings add the
# secret RELEASE_SIGNING_KEY and the variable RELEASE_PUBLIC_KEY it prints.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  TAG: ${{ github.ref_name }}
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: tag is vX.Y.Z or vX.Y.Z-rc.N, on main
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $TAG is not on main"; exit 1; }
      - name: notes from docs/CHANGELOG.md
        run: |
          awk -v h="## ${TAG%%-*}" '$0 == h {f = 1; next} /^## / {f = 0} f' docs/CHANGELOG.md > notes.md
          grep -q . notes.md || { echo "docs/CHANGELOG.md has no section '## ${TAG%%-*}'"; exit 1; }
      # The model catalog with live prices and limits; offline it is a seed.
      - run: go run ./pkg/catalog/build > pkg/catalog/catalog.json
      - name: build
        env:
          PUB: ${{ vars.RELEASE_PUBLIC_KEY }}
        run: |
          [ -n "$PUB" ] || { echo "set the RELEASE_PUBLIC_KEY variable: go run ./pkg/release/keygen"; exit 1; }
          ld="-s -w -X pai/pkg/version.V=$TAG -X pai/pkg/release.Repo=$GITHUB_REPOSITORY -X pai/pkg/release.Key=$PUB"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            for b in pai pai-server; do
              GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "$ld" -o "dist/$b-$os-$arch$ext" "./cmd/$b"
            done
          done
          [ "$(dist/pai-linux-amd64 version)" = "$TAG" ]
          for s in install.sh install.ps1; do sed "s/@VERSION@/$TAG/g; s#@REPO@#$GITHUB_REPOSITORY#g" "install/$s" > "dist/$s"; done
          printf '%s\n' "$TAG" > dist/VERSION
          cp docs/CHANGELOG.md THIRD_PARTY_NOTICES dist/
      - name: SHA256SUMS, signed
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          cd dist && sha256sum * > SHA256SUMS
          cat > "$RUNNER_TEMP/sign.go" <<'GO'
          package main

          import (
          	"crypto/ed25519"
          	"encoding/base64"
          	"os"
          )

          func main() {
          	seed, err := base64.StdEncoding.DecodeString(os.Getenv("KEY"))
          	if err != nil || len(seed) != ed25519.SeedSize {
          		panic("RELEASE_SIGNING_KEY is not a base64 ed25519 seed")
          	}
          	k := ed25519.NewKeyFromSeed(seed)
          	if base64.StdEncoding.EncodeToString(k.Public().(ed25519.PublicKey)) != os.Getenv("PUB") {
          		panic("RELEASE_SIGNING_KEY is not the pair of RELEASE_PUBLIC_KEY")
          	}
          	b, err := os.ReadFile("SHA256SUMS")
          	if err != nil {
          		panic(err)
          	}
          	if err := os.WriteFile("SHA256SUMS.sig", ed25519.Sign(k, b), 0o644); err != nil {
          		panic(err)
          	}
          }
          GO
          PUB='${{ vars.RELEASE_PUBLIC_KEY }}' go run "$RUNNER_TEMP/sign.go"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=; [[ $TAG == *-rc.* ]] && pre=--prerelease
          gh release create "$TAG" dist/* --title "PAI $TAG" --notes-file notes.md $pre
