name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd pkg web)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - name: cross-build
        run: |
          for t in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done
  # The server embeds web/dist: it must be the build of web/src.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
      # A block scalar: a plain one may not hold ": ", which the message has.
      - run: |
          git diff --exit-code -- web/dist || { echo "web/dist is stale: run npm run build in web/ and commit it"; exit 1; }
